# coturn config TEMPLATE for Construct Meet  (STUN + TURN).
# ------------------------------------------------------------------------
# Placeholders (__SECRET__, __REALM__, __EXTERNAL_IP__) are resolved at
# container start by entrypoint.sh from env vars, so NO secret ever lives in
# this repo or the image. Set on the CapRover app:
#   TURN_SHARED_SECRET  (same value the turn-auth credential service uses)
#   TURN_REALM          (e.g. turn.lisaos.dev)
#   TURN_EXTERNAL_IP    (the box public IP, e.g. 46.224.45.43)
#
# Runs on HOST networking (CapRover Service Update Override - see README),
# because TURN needs raw UDP/TCP plus a UDP relay-port range that can't be
# reverse-proxied by nginx or published through the Swarm ingress mesh.

# --- Listening -----------------------------------------------------------
listening-port=3478
listening-ip=0.0.0.0
# Public IP of the box. REQUIRED when the host's primary interface is not the
# public address (cloud NAT).
external-ip=__EXTERNAL_IP__

# --- Relay port range ----------------------------------------------------
# ~2 UDP ports per peer connection. Must be opened in the firewall as a range.
min-port=49160
max-port=49200

# --- Auth: ephemeral HMAC (the proper, long-term scheme) -----------------
# coturn validates time-limited credentials minted by the turn-auth service:
#   username   = <unix-expiry>[:<opaque>]
#   credential = base64( HMAC-SHA1( TURN_SHARED_SECRET, username ) )
# The secret never leaves the server; leaked creds expire within the TTL.
use-auth-secret
static-auth-secret=__SECRET__
realm=__REALM__
server-name=__REALM__

# --- TLS -----------------------------------------------------------------
# Auto-enabled by entrypoint.sh when a cert is mounted at
# /etc/coturn/certs/{fullchain,privkey}.pem -> adds tls-listening-port=5349.
# turns: traverses firewalls that only allow TLS.

# --- Hardening -----------------------------------------------------------
fingerprint
stale-nonce=600
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Never relay to internal ranges (blocks SSRF / scanning the private network).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Abuse caps (tune as needed).
user-quota=12
total-quota=1200
